# =====================================================================
# Notifications Discord automatiques
#
# L'heure de lancement n'est plus choisie par GitHub (ses tâches
# planifiées partaient avec des heures de retard) : c'est Supabase qui
# demande le lancement à l'heure pile, voir sql/17_notifications_a_l_heure.sql.
#   * planning du jour : tous les jours à 11h47 (heure de Paris) ;
#   * relance des dispos : le vendredi et le dimanche à 19h47.
#
# Lancement manuel : onglet Actions > Notifications Discord > Run workflow.
# =====================================================================

name: Notifications Discord

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Notification à envoyer"
        type: choice
        options: [planning, relance]
        default: planning
      dry_run:
        description: "Test : afficher le message dans les logs sans l'envoyer"
        type: boolean
        default: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Envoyer la notification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/notify.py
